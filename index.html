<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Catcher Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1a1a2e; color: #fff;
      font-family: sans-serif; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; overflow: hidden;
    }
    h2 { margin-bottom: 5px; color: #ffeb3b; }
    #score { font-size: 18px; margin-bottom: 10px; color: #00e676; }
    canvas { background: #162447; border: 4px solid #e43f5a; border-radius: 12px; touch-action: none; }
    .btn {
      margin-top: 15px; padding: 10px 24px; background: #e43f5a;
      color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>⭐ Star Catcher ⭐</h2>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="360" height="500"></canvas>
  <button class="btn" id="startBtn">Start Game</button>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('startBtn');
    let score = 0, isPlaying = false, animationId;
    let basket = { x: 140, y: 450, w: 80, h: 20, speed: 8, dx: 0 };
    let star = { x: 50, y: -30, radius: 15, speed: 4 };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') basket.dx = -basket.speed;
      if (e.key === 'ArrowRight') basket.dx = basket.speed;
    });
    window.addEventListener('keyup', () => { basket.dx = 0; });
    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      basket.x = (e.touches[0].clientX - rect.left) - basket.w / 2;
    });
    canvas.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      basket.x = (e.clientX - rect.left) - basket.w / 2;
    });

    function update() {
      if (!isPlaying) return;
      basket.x += basket.dx;
      if (basket.x < 0) basket.x = 0;
      if (basket.x + basket.w > canvas.width) basket.x = canvas.width - basket.w;
      star.y += star.speed;
      if (star.y + star.radius >= basket.y && star.x >= basket.x && star.x <= basket.x + basket.w) {
        score += 10; scoreEl.innerText = `Score: ${score}`;
        star.y = -30; star.x = Math.random() * (canvas.width - 30); star.speed += 0.2;
      }
      if (star.y > canvas.height) {
        isPlaying = false; cancelAnimationFrame(animationId);
        startBtn.style.display = 'block'; startBtn.innerText = 'Play Again (Score: ' + score + ')';
      }
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5252';
      ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); ctx.fill();
    }
    function loop() {
      update(); draw(); if (isPlaying) animationId = requestAnimationFrame(loop);
    }
    startBtn.addEventListener('click', () => {
      score = 0; scoreEl.innerText = `Score: ${score}`;
      star.speed = 4; star.y = -30; star.x = Math.random() * (canvas.width - 30);
      basket.x = 140; isPlaying = true; startBtn.style.display = 'none'; loop();
    });
    draw();
  </script>
</body>
</html>
